<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
    }
    .header {
      background: linear-gradient(135deg, #075e54, #128c7e);
      color: white;
      padding: 16px 20px;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 3px; }
    .content { padding: 16px 20px; }
    .step {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .step-num {
      background: #00a884;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-text { font-size: 13px; line-height: 1.4; color: #333; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .btn-primary {
      background: #00a884;
      color: white;
    }
    .btn-primary:hover { background: #008f72; }
    .btn-primary:disabled {
      background: #94c7bd;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e4e6eb;
      color: #333;
      margin-top: 8px;
      font-size: 13px;
    }
    .btn-secondary:hover { background: #d8dadf; }
    .status-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #e8f5e9;
      font-size: 13px;
      display: none;
      line-height: 1.4;
    }
    .status-box.error { background: #ffebee; color: #c62828; }
    .status-box.success { background: #e8f5e9; color: #2e7d32; }
    .footer {
      padding: 10px 20px;
      font-size: 11px;
      color: #888;
      text-align: center;
      border-top: 1px solid #e0e0e0;
    }
    .count-badge {
      background: #075e54;
      color: white;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 14px;
      font-weight: 700;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WA Group Scraper</h1>
    <p>Export group members to XLSX in one click</p>
  </div>

  <div class="content">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Open <b>web.whatsapp.com</b> and open any group chat</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Click <b>"Scrape Members"</b> below — done!</div>
    </div>

    <button id="scrapeBtn" class="btn btn-primary">Scrape Members</button>
    <button id="openWidgetBtn" class="btn btn-secondary">Open Floating Widget on WhatsApp</button>

    <div id="statusBox" class="status-box"></div>
  </div>

  <div class="footer">
    <span id="countDisplay">Members: <span class="count-badge">0</span></span>
  </div>

  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
